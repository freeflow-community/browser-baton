<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Session Handoff</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span class="dot" id="summary-dot"></span><strong>Session Handoff</strong></div>
    <span class="muted small" id="summary-text">…</span>
  </header>

  <section id="requests-view">
    <h2>Requests</h2>
    <div id="requests"></div>
    <p class="muted" id="no-requests">No pending requests.</p>
  </section>

  <section id="agents-view">
    <h2>Agents</h2>
    <div id="agents"></div>
    <p class="muted" id="no-agents" hidden>No agents registered yet. Add one below.</p>
    <button id="add-toggle" class="ghost small">+ Add agent</button>

    <div id="add-form" hidden>
      <p class="lead small">Run <code>browser-handoff pair</code> where the agent runs and enter the code it prints.</p>
      <label>Relay URL <input id="relay" type="url" placeholder="http://127.0.0.1:8787" spellcheck="false"></label>
      <label>Pairing code <input id="code" type="text" placeholder="ABCD-EFGH" maxlength="9" autocomplete="off" spellcheck="false"></label>
      <label>Name (optional) <input id="label" type="text" placeholder="e.g. work laptop agent" autocomplete="off"></label>
      <button id="pair-btn" class="primary">Pair</button>
      <p class="error" id="pair-error" hidden></p>
    </div>
    <p class="muted small">This browser's fingerprint: <span id="ext-fp"></span></p>
  </section>

  <h2 class="log-h">Recent activity</h2>
  <ul id="log"></ul>

  <template id="request-tpl">
    <div class="request">
      <div class="request-head">
        <span class="label"></span>
        <span class="muted small expires"></span>
      </div>
      <div class="from muted small"></div>
      <ul class="origins"></ul>
      <div class="status muted small"></div>
      <div class="actions">
        <button class="start">Start</button>
        <button class="done primary">Done</button>
        <button class="decline ghost">Decline</button>
        <button class="dismiss ghost" hidden>Dismiss</button>
      </div>
      <p class="error req-error" hidden></p>
    </div>
  </template>

  <template id="agent-tpl">
    <div class="agent">
      <span class="dot"></span>
      <div class="meta">
        <div class="name"></div>
        <div class="muted small sub"></div>
      </div>
      <div class="agent-actions">
        <button class="rename ghost small">Rename</button>
        <button class="revoke ghost small danger">Revoke</button>
      </div>
    </div>
  </template>

  <script src="lib/nacl-fast.min.js"></script>
  <script src="lib/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
